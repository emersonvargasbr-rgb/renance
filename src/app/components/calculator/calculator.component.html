<div class="bg-gray-800 p-6 rounded-2xl border border-gray-700 shadow-2xl max-w-lg w-full mx-auto mt-6">
  <h2 class="text-xl font-bold text-emerald-400 mb-6 flex items-center">
    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
    Simulador de Arbitraje
  </h2>

  <!-- Inputs de Datos -->
  <div class="space-y-4">
    <div>
      <label class="block text-xs text-gray-400 uppercase tracking-wider mb-1">Monto a Transar (USD/USDT)</label>
      <input type="number" [(ngModel)]="amount" class="w-full bg-gray-900 border border-gray-600 rounded-lg p-3 text-white focus:border-emerald-500 outline-none">
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-xs text-gray-400 uppercase tracking-wider mb-1">Tasa de Compra</label>
        <input type="number" [(ngModel)]="buyRate" class="w-full bg-gray-900 border border-gray-600 rounded-lg p-3 text-white focus:border-emerald-500 outline-none">
      </div>
      <div>
        <label class="block text-xs text-gray-400 uppercase tracking-wider mb-1">Tasa de Venta</label>
        <input type="number" [(ngModel)]="sellRate" class="w-full bg-gray-900 border border-gray-600 rounded-lg p-3 text-white focus:border-emerald-500 outline-none">
      </div>
    </div>

    <div>
      <label class="block text-xs text-gray-400 uppercase tracking-wider mb-1">Comisiones (Fijas)</label>
      <input type="number" [(ngModel)]="fee" class="w-full bg-gray-900 border border-gray-600 rounded-lg p-3 text-white focus:border-emerald-500 outline-none">
    </div>
  </div>

  <!-- Panel de Resultados -->
  <div class="mt-6 bg-gray-900 p-4 rounded-xl border border-gray-700">
    <div class="flex justify-between text-sm mb-2">
      <span class="text-gray-400">Costo Total:</span>
      <span class="text-white">{{ totalCost | number:'1.2-2' }}</span>
    </div>
    <div class="flex justify-between text-sm mb-4">
      <span class="text-gray-400">Ingreso Neto (Restando comisión):</span>
      <span class="text-white">{{ netRevenue | number:'1.2-2' }}</span>
    </div>
    
    <div class="pt-4 border-t border-gray-700 flex justify-between items-center">
      <div>
        <span class="block text-xs text-gray-400 uppercase tracking-wider">Ganancia Neta</span>
        <span class="text-2xl font-bold" [ngClass]="{'text-emerald-400': netProfit > 0, 'text-red-400': netProfit < 0}">
          {{ netProfit > 0 ? '+' : '' }}{{ netProfit | number:'1.2-2' }}
        </span>
      </div>
      <div class="text-right">
        <span class="block text-xs text-gray-400 uppercase tracking-wider">Rendimiento (ROI)</span>
        <span class="text-lg font-bold text-blue-400">{{ roiPercentage | number:'1.2-2' }}%</span>
      </div>
    </div>
  </div>

  <button (click)="saveOperation()" class="mt-6 w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 px-4 rounded-lg transition-colors shadow-lg">
    Registrar Operación
  </button>
</div>
