<div class="bg-gray-800 p-8 rounded-2xl border border-gray-700 shadow-2xl max-w-sm w-full mx-auto mt-12 text-center">
  <h2 class="text-2xl font-bold text-emerald-400 mb-6">Acceder a Renance</h2>
  
  <div class="space-y-4 text-left">
    <div>
      <label class="block text-xs text-gray-400 uppercase tracking-wider mb-1">Correo Electrónico</label>
      <input type="email" [(ngModel)]="email" class="w-full bg-gray-900 border border-gray-600 rounded-lg p-3 text-white focus:border-emerald-500 outline-none">
    </div>
    <div>
      <label class="block text-xs text-gray-400 uppercase tracking-wider mb-1">Contraseña</label>
      <input type="password" [(ngModel)]="password" class="w-full bg-gray-900 border border-gray-600 rounded-lg p-3 text-white focus:border-emerald-500 outline-none">
    </div>
  </div>

  <p *ngIf="errorMsg" class="text-red-400 text-sm mt-4">{{ errorMsg }}</p>

  <div class="mt-6 flex flex-col gap-3">
    <button (click)="handleLogin()" [disabled]="loading" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 px-4 rounded-lg transition-colors shadow-lg disabled:opacity-50">
      {{ loading ? 'Cargando...' : 'Iniciar Sesión' }}
    </button>
    <button (click)="handleRegister()" [disabled]="loading" type="button" class="w-full bg-gray-700 hover:bg-gray-600 text-gray-200 font-semibold py-2 px-4 rounded-lg transition-colors text-sm">
      Crear Cuenta Nueva
    </button>
  </div>
</div>
