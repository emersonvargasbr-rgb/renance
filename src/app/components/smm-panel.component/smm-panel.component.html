<div class="bg-gray-800 p-6 rounded-2xl border border-gray-700 shadow-2xl max-w-2xl w-full mx-auto mt-6">
  
  <!-- Cabecera del Panel -->
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-xl font-bold text-purple-400 flex items-center">
      <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
      Servicios SMM (Boost)
    </h2>
    <div class="text-right">
      <span class="block text-xs text-gray-400 uppercase">Saldo Disponible</span>
      <span class="text-sm font-bold text-white">R$ 145.50</span>
    </div>
  </div>

  <!-- Paso 1: Red Social (Pestañas Visuales) -->
  <label class="block text-xs text-gray-400 uppercase tracking-wider mb-2">1. Selecciona la Red Social</label>
  <div class="grid grid-cols-3 gap-3 mb-6">
    <button (click)="selectedNetwork = 'instagram'; selectedPack = null" 
            [class.ring-2]="selectedNetwork === 'instagram'" [class.ring-purple-500]="selectedNetwork === 'instagram'" [class.bg-gray-700]="selectedNetwork === 'instagram'"
            class="bg-gray-900 border border-gray-700 rounded-xl p-3 flex flex-col items-center justify-center transition-all hover:bg-gray-800">
      <span class="text-2xl mb-1">📸</span>
      <span class="text-xs font-medium" [class.text-white]="selectedNetwork === 'instagram'" [class.text-gray-400]="selectedNetwork !== 'instagram'">Instagram</span>
    </button>
    <button (click)="selectedNetwork = 'tiktok'; selectedPack = null; selectedType = 'followers'" 
            [class.ring-2]="selectedNetwork === 'tiktok'" [class.ring-purple-500]="selectedNetwork === 'tiktok'" [class.bg-gray-700]="selectedNetwork === 'tiktok'"
            class="bg-gray-900 border border-gray-700 rounded-xl p-3 flex flex-col items-center justify-center transition-all hover:bg-gray-800">
      <span class="text-2xl mb-1">🎵</span>
      <span class="text-xs font-medium" [class.text-white]="selectedNetwork === 'tiktok'" [class.text-gray-400]="selectedNetwork !== 'tiktok'">TikTok</span>
    </button>
    <button (click)="selectedNetwork = 'youtube'; selectedPack = null" 
            [class.ring-2]="selectedNetwork === 'youtube'" [class.ring-purple-500]="selectedNetwork === 'youtube'" [class.bg-gray-700]="selectedNetwork === 'youtube'"
            class="bg-gray-900 border border-gray-700 rounded-xl p-3 flex flex-col items-center justify-center transition-all hover:bg-gray-800 opacity-50">
      <span class="text-2xl mb-1">▶️</span>
      <span class="text-xs font-medium text-gray-400">YouTube</span>
    </button>
  </div>

  <!-- Paso 2: Tipo de Servicio -->
  <div class="flex space-x-2 mb-6 bg-gray-900 p-1 rounded-lg border border-gray-700 overflow-x-auto">
    <button (click)="selectedType = 'followers'; selectedPack = null" 
            [class.bg-gray-700]="selectedType === 'followers'" [class.text-white]="selectedType === 'followers'"
            class="flex-1 py-2 px-4 rounded-md text-xs font-semibold text-gray-400 transition-colors whitespace-nowrap">
      Seguidores
    </button>
    <button (click)="selectedType = 'likes'; selectedPack = null" 
            [class.bg-gray-700]="selectedType === 'likes'" [class.text-white]="selectedType === 'likes'"
            class="flex-1 py-2 px-4 rounded-md text-xs font-semibold text-gray-400 transition-colors whitespace-nowrap">
      Likes
    </button>
    <button (click)="selectedType = 'views'; selectedPack = null" 
            [class.bg-gray-700]="selectedType === 'views'" [class.text-white]="selectedType === 'views'"
            class="flex-1 py-2 px-4 rounded-md text-xs font-semibold text-gray-400 transition-colors whitespace-nowrap">
      Vistas
    </button>
  </div>

  <!-- Paso 3: Link de Destino -->
  <div class="mb-6">
    <label class="block text-xs text-gray-400 uppercase tracking-wider mb-2">2. Link del Perfil / Post</label>
    <div class="relative">
      <span class="absolute left-3 top-3.5 text-gray-500">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
      </span>
      <input type="text" [(ngModel)]="targetUrl" placeholder="https://instagram.com/usuario" class="w-full bg-gray-900 border border-gray-600 rounded-lg py-3 pl-9 pr-3 text-white focus:border-purple-500 outline-none text-sm">
    </div>
  </div>

  <!-- Paso 4: Selección de Paquete (Grid) -->
  <label class="block text-xs text-gray-400 uppercase tracking-wider mb-2">3. Elige un Paquete</label>
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-6">
    
    <div *ngIf="currentPacks.length === 0" class="col-span-full text-center py-4 text-gray-500 text-sm">
      No hay paquetes disponibles para esta selección.
    </div>

    <!-- Generación dinámica de paquetes -->
    <div *ngFor="let pack of currentPacks" 
         (click)="selectPack(pack)"
         [class.border-purple-500]="selectedPack?.id === pack.id"
         [class.bg-purple-500]="selectedPack?.id === pack.id"
         [class.bg-opacity-10]="selectedPack?.id === pack.id"
         class="bg-gray-900 border border-gray-700 rounded-xl p-4 cursor-pointer hover:border-purple-400 transition-all relative overflow-hidden group">
      
      <!-- Cinta de selección -->
      <div *ngIf="selectedPack?.id === pack.id" class="absolute top-0 right-0 w-10 h-10 bg-purple-500 rounded-bl-full flex items-start justify-end pt-1 pr-1">
        <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
      </div>

      <div class="text-2xl font-black text-white mb-1">{{ pack.amount | number }} <span class="text-xs text-gray-400 font-normal">{{ selectedType }}</span></div>
      <div class="text-sm font-medium text-purple-400 mb-2">R$ {{ pack.priceBrl | number:'1.2-2' }}</div>
      
      <div class="flex items-center text-[10px] text-gray-500 space-x-2">
        <span class="bg-gray-800 px-2 py-0.5 rounded">{{ pack.speed }}</span>
        <span class="bg-gray-800 px-2 py-0.5 rounded truncate">{{ pack.quality }}</span>
      </div>
    </div>
  </div>

  <!-- Botón de Envío (con estado según selección) -->
  <button (click)="processOrder()" 
          [disabled]="!selectedPack || !targetUrl"
          class="w-full bg-gradient-to-r from-purple-600 to-fuchsia-600 hover:from-purple-500 hover:to-fuchsia-500 text-white font-bold py-4 px-4 rounded-xl transition-all shadow-[0_0_20px_rgba(168,85,247,0.3)] disabled:opacity-50 disabled:cursor-not-allowed flex justify-center items-center">
    
    <span *ngIf="selectedPack && targetUrl">Pagar R$ {{ selectedPack.priceBrl | number:'1.2-2' }} y Enviar</span>
    <span *ngIf="!selectedPack || !targetUrl">Completa los datos arriba</span>
    
    <svg *ngIf="selectedPack && targetUrl" class="w-5 h-5 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
  </button>

</div>
